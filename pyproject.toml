[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pawer"
version = "1.0.0"
description = "Super lightweight browser designed exclusively for Streamlit apps and local web apps"
readme = "README.md"
authors = [{ name = "Pawer Team" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pywebview>=5.0.0",
    "pythonnet>=3.0.0",
    "streamlit>=1.30.0",
]

[project.scripts]
pawer = "pawer.cli:main"
